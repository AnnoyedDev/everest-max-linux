[package]
name = "everest-basecamp"
version = "1.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/AnnoyedDev/everest-max-linux"
description = "Base Camp pour Linux : Mountain Everest Max (éclairage, touches, macros, touches écran, dock)"

[[bin]]
name = "everest"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
ab_glyph = "0.2.32"
resvg = { version = "0.50", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2"

[profile.release]
opt-level = 3

[package.metadata.deb]
name = "everest-max-linux"
maintainer = "AnnoyedDev <35310573+AnnoyedDev@users.noreply.github.com>"
section = "utils"
depends = "$auto, pulseaudio-utils | pipewire-pulse, fontconfig, pkexec | policykit-1"
assets = [
    ["target/release/everest", "usr/bin/", "755"],
    ["70-mountain-everest.rules", "usr/lib/udev/rules.d/", "644"],
    ["../packaging/everest-uinput.conf", "usr/lib/modules-load.d/", "644"],
    ["../packaging/everest-basecamp.desktop", "usr/share/applications/", "644"],
    ["assets/everest-basecamp.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "everest-max-linux"
assets = [
    { source = "target/release/everest", dest = "/usr/bin/everest", mode = "755" },
    { source = "70-mountain-everest.rules", dest = "/usr/lib/udev/rules.d/70-mountain-everest.rules", mode = "644" },
    { source = "../packaging/everest-uinput.conf", dest = "/usr/lib/modules-load.d/everest-uinput.conf", mode = "644" },
    { source = "../packaging/everest-basecamp.desktop", dest = "/usr/share/applications/everest-basecamp.desktop", mode = "644" },
    { source = "assets/everest-basecamp.svg", dest = "/usr/share/icons/hicolor/scalable/apps/everest-basecamp.svg", mode = "644" },
]

[package.metadata.generate-rpm.requires]
fontconfig = "*"
pulseaudio-utils = "*"
polkit = "*"
